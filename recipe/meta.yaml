{% set name = "importlib_resources" %}
{% set version = "7.1.0" %}

package:
  name: {{ name }}-suite
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0722d4c6212489c530f2a145a34c0a7a3b4721bc96a15fada5930e2a0b760708

build:
  number: 0
  skip: true  # [py<310]

outputs:
  - name: importlib_resources
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      host:
        - python
        - pip
        - setuptools >=77
        - setuptools_scm >=3.4.1
        - toml
        # Upstream's pyproject.toml requires also "coherent.licensed" which is not available
        # on main channel. It is only used, though, for obtaining license that is already
        # present in pypi package.
      run:
        - python
        - zipp >=3.1.0  # [py<310]
    test:
      imports:
        - importlib_resources
        - importlib_resources._adapters
        - importlib_resources.readers
      requires:
        - pip
        - pytest >=6,!= 8.1
        - zipp >=3.17.0
        - jaraco.test >=5.4
      commands:
        - pip check
        - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
        # AttributeError: module 'test.support.import_helper' has no attribute 'isolated_modules'
        # required for tests isolated_modules() function was added in Python 3.11
        - pytest --pyargs importlib_resources.tests  # [py>=311]
  - name: importlib-resources
    build:
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("importlib_resources", max_pin="x.x.x") }}
    test:
      imports:
        - importlib_resources
        - importlib_resources._adapters
        - importlib_resources.readers
      requires:
        - pip
        - python
      commands:
        - pip check
        - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

about:
  home: https://importlib-resources.readthedocs.io
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: Backport of Python 3.7's standard library `importlib.resources`
  description: |
    importlib_resources is a backport of Python standard library importlib.resources module for older Pythons.

    The key goal of this module is to replace parts of pkg_resources with a solution in Python's stdlib that
    relies on well-defined APIs. This makes reading resources included in packages easier, with more stable
    and consistent semantics.
  dev_url: https://github.com/python/importlib_resources
  doc_url: https://importlib-resources.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
